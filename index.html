      content="Privacy-first, local-first resume and cover letter builder. Turn AI-prepared content into precise PDF or Word documents. Your content stays in your browser."
    />
    <meta name="twitter:image" content="https://resume.kovina.org/openresume-social.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "OpenResume",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Privacy-first, local-first resume and cover letter builder. Turn AI-prepared content into precise PDF or Word documents. Your content stays in your browser.",
        "url": "https://resume.kovina.org/",
        "image": "https://resume.kovina.org/openresume-social.png",
        "author": {
          "@type": "Person",
          "name": "Sparsh Sam",
          "url": "https://github.com/sparshsam"
        },
        "license": "https://github.com/sparshsam/openresume/blob/main/LICENSE",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <title>OpenResume — Resume and cover letter builder</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('openresume-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#0f1210' : '#f4f5f2');
          }
          var favicons = document.querySelectorAll('link[data-favicon]');
          for (var index = 0; index < favicons.length; index += 1) {
            var size = favicons[index].getAttribute('data-favicon');
            favicons[index].setAttribute('href', '/favicon-' + size + '.png');
          }
        } catch (error) {
          /* The app falls back to light if storage or matchMedia is unavailable. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
